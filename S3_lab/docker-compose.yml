services:
  minio:
    image: bitnamilegacy/minio:2024.12.18-debian-12-r0
    container_name: s3_lab_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - s3_lab_network
    restart: unless-stopped

  minio-init:
    image: bitnamilegacy/minio-client:2024.11.21
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          i=$$((i + 1))
          if [ "$$i" -gt 30 ]; then
            exit 1
          fi
          sleep 2
        done
        mc mb --ignore-existing local/warehouse
        mc mb --ignore-existing local/lab-bucket
    networks:
      - s3_lab_network
    restart: "no"

volumes:
  minio_data:

networks:
  s3_lab_network:
    driver: bridge
